[project]
name = "jitdemo"
version = "0.1.0"
description = "JIT 缺陷预测评估函数的最小骨架（第 04 课测试门禁用）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jitdemo"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

# 显式声明规则集，不吃 ruff 新版本的「默认值变动」。
# 教训来自第 04 课实测：dev 依赖写 ruff>=0.6 会装到最新版，
# 而新版本默认多出的 RUF022（__all__ 需字母序）让 CI 突然变红。
# 显式 select 后，行为与 ruff 版本无关，可复现。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["jitdemo"]
